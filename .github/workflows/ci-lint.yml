name: CI / Lint

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86   # v5.4.2
      with:
        enable-cache: true
      # The pre-commit cache holds one virtualenv per hook. Restore and save are
      # split (instead of a single `actions/cache` step) because the save must
      # be conditional: see the save step below. Keyed on the config hash so a
      # changed hook version invalidates it; the prefix `restore-keys` still
      # lets a run reuse the envs of every hook the config did not touch.
    - uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57   # v4.2.0
      id: precommit-cache
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: pre-commit-${{ runner.os }}-
    - run: |
        git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
        git fetch --depth=1 origin ${{ github.event.pull_request.head.sha }}
        uv run pre-commit run \
          --from-ref ${{ github.event.pull_request.base.sha }} \
          --to-ref ${{ github.event.pull_request.head.sha }} \
          --show-diff-on-failure \
          --color always
      # Write back what the run installed or refreshed. `always()` so a failed
      # lint still saves envs it managed to build, and skipped on an exact
      # cache hit because the entry already exists under that key — a cache is
      # immutable, saving it again is an error, and nothing would have changed.
    - uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57   # v4.2.0
      if: always() && steps.precommit-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
